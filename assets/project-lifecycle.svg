<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .phase-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .phase-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #374151; }
      .phase-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #6b7280; }
      .checkpoint-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .checkpoint-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #4b5563; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10px; }
      .connector { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #9ca3af; }
      .checkpoint-diamond { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.75; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Main Title -->
  <text x="30" y="38" class="title">Two checkpoints gate the move from speed to safety</text>

  <!-- Phase 1: Discovery (Width: 230, x: 30..260) -->
  <g transform="translate(30, 68)">
    <rect width="230" height="120" class="card" />
    <text x="18" y="32" class="phase-title">Phase 1: Discovery</text>
    <text x="18" y="58" class="phase-desc">Prove the concept and find</text>
    <text x="18" y="76" class="phase-desc">the data shapes</text>
    <text x="18" y="102" class="phase-sub">Loose rules, wide edits</text>
  </g>

  <!-- Connection: Phase 1 to Checkpoint 1 (x: 260 to 295) -->
  <line x1="260" y1="128" x2="295" y2="128" class="connector" />
  <polygon points="295,124 303,128 295,132" class="arrow-head" />

  <!-- Checkpoint 1 Diamond (Center x: 323, y: 128) -->
  <g transform="translate(323, 128)">
    <polygon points="0,-18 18,0 0,18 -18,0" class="checkpoint-diamond" />
  </g>

  <!-- Checkpoint 1 Labels -->
  <text x="323" y="218" class="checkpoint-label">Checkpoint 1</text>
  <text x="323" y="238" class="checkpoint-desc">Domain and contract freeze</text>

  <!-- Connection: Checkpoint 1 to Phase 2 (x: 341 to 376) -->
  <line x1="341" y1="128" x2="376" y2="128" class="connector" />
  <polygon points="376,124 384,128 376,132" class="arrow-head" />

  <!-- Phase 2: Buildout (Width: 230, x: 385..615) -->
  <g transform="translate(385, 68)">
    <rect width="230" height="120" class="card" />
    <text x="18" y="32" class="phase-title">Phase 2: Buildout</text>
    <text x="18" y="58" class="phase-desc">Add features across the</text>
    <text x="18" y="76" class="phase-desc">agreed domains</text>
    <text x="18" y="102" class="phase-sub">Parallel lanes, small PRs</text>
  </g>

  <!-- Connection: Phase 2 to Checkpoint 2 (x: 615 to 650) -->
  <line x1="615" y1="128" x2="650" y2="128" class="connector" />
  <polygon points="650,124 658,128 650,132" class="arrow-head" />

  <!-- Checkpoint 2 Diamond (Center x: 678, y: 128) -->
  <g transform="translate(678, 128)">
    <polygon points="0,-18 18,0 0,18 -18,0" class="checkpoint-diamond" />
  </g>

  <!-- Checkpoint 2 Labels -->
  <text x="678" y="218" class="checkpoint-label">Checkpoint 2</text>
  <text x="678" y="238" class="checkpoint-desc">Production-readiness audit</text>

  <!-- Connection: Checkpoint 2 to Phase 3 (x: 696 to 731) -->
  <line x1="696" y1="128" x2="731" y2="128" class="connector" />
  <polygon points="731,124 739,128 731,132" class="arrow-head" />

  <!-- Phase 3: Production (Width: 230, x: 740..970, right margin 30px) -->
  <g transform="translate(740, 68)">
    <rect width="230" height="120" class="card" />
    <text x="18" y="32" class="phase-title">Phase 3: Production</text>
    <text x="18" y="58" class="phase-desc">Bug fixes, stability and</text>
    <text x="18" y="76" class="phase-desc">small additions</text>
    <text x="18" y="102" class="phase-sub">Strict gates on every PR</text>
  </g>
</svg>
