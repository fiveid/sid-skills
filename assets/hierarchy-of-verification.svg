<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #4b5563; }
      .lvl-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .lvl-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #4b5563; text-anchor: middle; }
      .card-white { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10px; }
      .card-shaded { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.5; rx: 10px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Headers -->
  <text x="30" y="38" class="title">The higher the level, the more it needs human judgement</text>
  <text x="30" y="62" class="subtitle">Shaded levels are handled by machines, so reviewers don't spend time there</text>

  <!-- Level 5: Top (Width: 480, Center: 460 -> x: 220) -->
  <g transform="translate(220, 95)">
    <rect width="480" height="58" class="card-white" />
    <text x="240" y="26" class="lvl-title">5 · What we build and why — people only</text>
    <text x="240" y="46" class="lvl-desc">Problem, priorities and roadmap</text>
  </g>

  <!-- Level 4 (Width: 580, Center: 460 -> x: 170) -->
  <g transform="translate(170, 163)">
    <rect width="580" height="58" class="card-white" />
    <text x="290" y="26" class="lvl-title">4 · Plan and scope — most review time</text>
    <text x="290" y="46" class="lvl-desc">Read the plan before it starts; predict the diff</text>
  </g>

  <!-- Level 3 (Width: 680, Center: 460 -> x: 120) -->
  <g transform="translate(120, 231)">
    <rect width="680" height="58" class="card-white" />
    <text x="340" y="26" class="lvl-title">3 · Does it actually work? — targeted checks</text>
    <text x="340" y="46" class="lvl-desc">Set the test cases first; check loops, transactions, races, auth</text>
  </g>

  <!-- Level 2: Shaded (Width: 780, Center: 460 -> x: 70) -->
  <g transform="translate(70, 299)">
    <rect width="780" height="58" class="card-shaded" />
    <text x="390" y="26" class="lvl-title">2 · Architectural drift — rules and CI</text>
    <text x="390" y="46" class="lvl-desc">Turn repeated review catches into lint rules and CI checks</text>
  </g>

  <!-- Level 1: Shaded (Width: 860, Center: 460 -> x: 30) -->
  <g transform="translate(30, 367)">
    <rect width="860" height="58" class="card-shaded" />
    <text x="430" y="26" class="lvl-title">1 · Code quality — CI only</text>
    <text x="430" y="46" class="lvl-desc">Formatting, types, unused imports; the agent fixes it</text>
  </g>
</svg>
